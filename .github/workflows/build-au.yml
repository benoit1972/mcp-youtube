name: Build Poomse Glitch (Audio Unit)

on:
  push:
    branches: [claude/plugin-format-au-s4g5da]
    paths: ['audio-unit/**', '!audio-unit/release/**', '.github/workflows/build-au.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: audio-unit
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate Audio Unit (auval)
        continue-on-error: true
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Ggr1 Benp

      - name: Package
        run: |
          mkdir -p dist
          COMP="$(find build -name '*.component' -maxdepth 6 | head -1)"
          echo "component: $COMP"
          ditto -c -k --keepParent "$COMP" "dist/PoomseGlitch-AU-macOS.zip"
          cat > dist/INSTALL.txt <<'TXT'
          0. Si vous aviez "Glitch Grain.component" : supprimez-le de ~/Library/Audio/Plug-Ins/Components/ (même identifiant, conflit sinon).
          1. Dézippez PoomseGlitch-AU-macOS.zip : vous obtenez "Poomse Glitch.component".
          2. Copiez-le dans  ~/Bibliothèque/Audio/Plug-Ins/Components/
             (Finder > Aller > Aller au dossier... > ~/Library/Audio/Plug-Ins/Components)
          3. Le plugin n'est pas signé par Apple : dans le Terminal, lancez
             xattr -dr com.apple.quarantine "$HOME/Library/Audio/Plug-Ins/Components/Poomse Glitch.component"
          4. Relancez Logic Pro / GarageBand (instrument : Audio Units > Benoit > Poomse Glitch).
          TXT

      - name: Publish the zip into the repository (audio-unit/release)
        working-directory: ${{ github.workspace }}
        run: |
          git rm -rq --ignore-unmatch audio-unit/release
          mkdir -p audio-unit/release
          cp audio-unit/dist/PoomseGlitch-AU-macOS.zip audio-unit/dist/INSTALL.txt audio-unit/release/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-unit/release
          git commit -m "Publish built Audio Unit zip" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: PoomseGlitch-AU-macOS
          path: audio-unit/dist/*
