name: Build Glitch Grain (Audio Unit)

on:
  push:
    branches: [claude/plugin-format-au-s4g5da]
    paths: ['audio-unit/**', '.github/workflows/build-au.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: audio-unit
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate Audio Unit (auval)
        continue-on-error: true
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Ggr1 Benp

      - name: Package
        run: |
          mkdir -p dist
          COMP="$(find build -name '*.component' -maxdepth 6 | head -1)"
          echo "component: $COMP"
          ditto -c -k --keepParent "$COMP" "dist/GlitchGrain-AU-macOS.zip"
          cat > dist/INSTALL.txt <<'TXT'
          1. Dézippez GlitchGrain-AU-macOS.zip : vous obtenez "Glitch Grain.component".
          2. Copiez-le dans  ~/Bibliothèque/Audio/Plug-Ins/Components/
             (Finder > Aller > Aller au dossier... > ~/Library/Audio/Plug-Ins/Components)
          3. Le plugin n'est pas signé par Apple : dans le Terminal, lancez
             xattr -dr com.apple.quarantine "$HOME/Library/Audio/Plug-Ins/Components/Glitch Grain.component"
          4. Relancez Logic Pro / GarageBand (instrument : Audio Units > Benoit > Glitch Grain).
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: GlitchGrain-AU-macOS
          path: audio-unit/dist/*
